<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayurveda Verse Search | Classical Texts Explorer</title>
    <meta name="description" content="Explore classical Ayurvedic texts including Sushruta Samhita, Ashtanga Hridaya, and Madhavanidanam with advanced semantic and hybrid search.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>Ayurveda<br/><span>Explorer</span></h2>
            </div>

            <div class="filter-section">
                <h3>Search Mode</h3>
                <div class="radio-group" id="mode-filter">
                    <label class="radio-btn"><input type="radio" name="mode" value="Hybrid" checked> <span>Hybrid</span></label>
                    <label class="radio-btn"><input type="radio" name="mode" value="Semantic"> <span>Semantic</span></label>
                    <label class="radio-btn"><input type="radio" name="mode" value="Keyword"> <span>Keyword</span></label>
                </div>
            </div>

            <div class="filter-section">
                <h3>Books</h3>
                <div class="checkbox-group" id="books-filter">
                    <label class="check-btn"><input type="checkbox" value="Sushruta Samhita"> <span>Sushruta Samhita</span></label>
                    <label class="check-btn"><input type="checkbox" value="Ashtanga Hridaya"> <span>Ashtanga Hridaya</span></label>
                    <label class="check-btn"><input type="checkbox" value="Madhavanisana Pt1"> <span>Madhavanisana Pt1</span></label>
                    <label class="check-btn"><input type="checkbox" value="Madhavanisana Pt2"> <span>Madhavanisana Pt2</span></label>
                </div>
            </div>

            <div class="filter-section">
                <h3>Results Limit <span id="limit-display" class="limit-badge">20</span></h3>
                <div class="range-wrapper">
                    <input type="range" id="results-limit" min="5" max="100" step="5" value="20">
                    <div class="range-labels">
                        <span>5</span>
                        <span>50</span>
                        <span>100</span>
                    </div>
                </div>
            </div>

            <div class="filter-section">
                <h3>Search Memory
                    <button id="clear-memory-btn" class="clear-memory-btn" title="Clear all memory">✕</button>
                </h3>
                <div id="history-list" class="history-list">
                    <p class="history-empty">No recent searches.</p>
                </div>
            </div>

            <div class="branding">
                <p>Powered by Meilisearch & AI</p>
                <p><a href="https://megharege.github.io/search-engine/" target="_blank" rel="noopener noreferrer">Visit Live Site</a></p>
            </div>
        </aside>

        <main class="main-content">
            <header>
                <div class="search-wrapper">
                    <div class="search-bar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="search-input" placeholder="Search verses, e.g. vata dosha jwara treatment..." autofocus>
                        <button id="clear-search-btn" class="clear-search-btn" title="Clear search">✕</button>
                    </div>
                </div>
                <div class="search-stats" id="search-stats">
                    <span id="stats-text"></span>
                </div>
            </header>

            <div class="results-container" id="results">
                <div class="empty-state">
                    <h3>Explore Ancient Wisdom</h3>
                    <p>Enter a query above to search through classical Ayurvedic texts.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
